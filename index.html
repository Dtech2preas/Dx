<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Watcher Rewards</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        .hidden { display: none; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; width: 80%; }
        #message { margin-top: 10px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>Student Rewards Program</h1>

    <!-- LOGIN / REGISTER SECTION -->
    <div id="auth-section">
        <div class="card">
            <h2>Login or Register</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <br>
            <button onclick="handleLogin()">Login</button>
            <button onclick="handleRegister()">Register</button>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden">
        <div class="card">
            <h2>Welcome, <span id="display-username"></span>!</h2>
            <p>Your Balance: <strong id="display-points">0</strong> Points</p>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <h3>Earn Points</h3>
            <p>Watch an ad for 15 seconds to earn 10 points.</p>
            <button id="watch-btn" onclick="startAdWatch()">Watch Ad & Earn</button>
            <p id="timer-status" style="font-style: italic; color: #555;"></p>
        </div>

        <div class="card">
            <h3>Redeem Rewards</h3>
            <p>Cost: 100 Points for a "Certificate of Worthy"</p>
            <button id="redeem-btn" onclick="redeemCertificate()" disabled>Claim Certificate</button>
        </div>
    </div>

    <div id="message"></div>

    <!-- Hidden Canvas for Certificate Generation -->
    <canvas id="certCanvas" width="800" height="600" style="display:none;"></canvas>

    <script>
        // CONFIGURATION
        // TODO: REPLACE THIS URL WITH YOUR CLOUDFLARE WORKER URL AFTER DEPLOYMENT
        // Example: const API_URL = "https://your-worker.your-name.workers.dev";
        const API_URL = "http://localhost:8000"; // Default for local testing
        const AD_LINK = "https://otieu.com/4/10205357";

        let currentUser = null;
        let adStartTime = null;
        let adWindow = null;

        // --- AUTH FUNCTIONS ---

        async function handleRegister() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return showMessage('Please enter username and password', 'error');

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if(res.ok) {
                    showMessage('Registration successful! Please login.', 'success');
                } else {
                    showMessage(data.error || 'Registration failed', 'error');
                }
            } catch (e) {
                console.error(e);
                showMessage('Connection error. Is the backend running?', 'error');
            }
        }

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return showMessage('Please enter username and password', 'error');

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if(res.ok) {
                    currentUser = { username: u, points: data.points };
                    showDashboard();
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (e) {
                console.error(e);
                showMessage('Connection error. Is the backend running?', 'error');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showMessage('Logged out', 'success');
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('display-username').innerText = currentUser.username;
            updatePointsDisplay();
            showMessage('', '');
        }

        function updatePointsDisplay() {
            document.getElementById('display-points').innerText = currentUser.points;
            const redeemBtn = document.getElementById('redeem-btn');
            if (currentUser.points >= 100) {
                redeemBtn.disabled = false;
                redeemBtn.innerText = "Claim Certificate (Download)";
            } else {
                redeemBtn.disabled = true;
                redeemBtn.innerText = `Need ${100 - currentUser.points} more points`;
            }
        }

        // --- AD WATCHING LOGIC ---

        function startAdWatch() {
            showMessage('Ad opened in new tab. Keep it open for 15 seconds...', 'success');
            adStartTime = Date.now();

            // Open the ad
            adWindow = window.open(AD_LINK, '_blank');

            // Visual feedback
            const btn = document.getElementById('watch-btn');
            btn.disabled = true;
            btn.innerText = "Watching...";
        }

        // Check when user returns to this tab
        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "visible" && adStartTime) {
                const now = Date.now();
                const elapsedSeconds = (now - adStartTime) / 1000;

                const btn = document.getElementById('watch-btn');
                btn.disabled = false;
                btn.innerText = "Watch Ad & Earn";

                adStartTime = null; // Reset

                if (elapsedSeconds >= 15) {
                    // Success!
                    await addPoints();
                } else {
                    // Fail
                    showMessage(`You only watched for ${Math.floor(elapsedSeconds)} seconds. Need 15s!`, 'error');
                }
            }
        });

        async function addPoints() {
            try {
                const res = await fetch(`${API_URL}/add-points`, {
                    method: 'POST',
                    body: JSON.stringify({ username: currentUser.username, amount: 10 })
                });
                const data = await res.json();
                if (res.ok) {
                    currentUser.points = data.points;
                    updatePointsDisplay();
                    showMessage('Success! 10 Points added.', 'success');
                } else {
                    showMessage('Error adding points', 'error');
                }
            } catch (e) {
                showMessage('Network error adding points', 'error');
            }
        }

        // --- CERTIFICATE LOGIC ---

        function redeemCertificate() {
            if (currentUser.points < 100) return;

            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');

            // Draw Background
            ctx.fillStyle = "#f9f9f9";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 10;
            ctx.strokeStyle = "#FFD700"; // Gold border
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            // Draw Text
            ctx.fillStyle = "#333";
            ctx.textAlign = "center";

            ctx.font = "bold 40px serif";
            ctx.fillText("CERTIFICATE OF WORTHY", canvas.width / 2, 150);

            ctx.font = "20px sans-serif";
            ctx.fillText("This certifies that", canvas.width / 2, 250);

            ctx.font = "italic bold 50px serif";
            ctx.fillText(currentUser.username, canvas.width / 2, 320);

            ctx.font = "20px sans-serif";
            ctx.fillText("has successfully completed the requirements.", canvas.width / 2, 400);

            const dateStr = new Date().toLocaleDateString();
            ctx.font = "18px sans-serif";
            ctx.fillText(`Date: ${dateStr}`, canvas.width / 2, 500);

            ctx.font = "14px sans-serif";
            ctx.fillText("Send this to Admin to claim your reward.", canvas.width / 2, 550);

            // Trigger Download
            const link = document.createElement('a');
            link.download = `Certificate_${currentUser.username}.png`;
            link.href = canvas.toDataURL();
            link.click();

            showMessage('Certificate downloaded! Send it to the admin.', 'success');
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.innerText = msg;
            el.className = type;
        }

    </script>
</body>
</html>
