<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>info</title>

    <!-- Ad Tag -->
    <script>(function(s){s.dataset.zone='10504195',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050617;
            --surface: #0f172a;
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #d4af37;
            --radius: 10px;
        }
        html, body { height: 100% }
        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center;
            padding-top: 20vh; /* 20% Top Space for Ads */
        }
        header {
            width: 100%; padding: 14px 0; text-align: center;
            background: var(--surface);
            border-bottom: 2px solid rgba(255,255,255,0.03);
            position: fixed; top: 0; left: 0; z-index: 50;
            height: 60px; box-sizing: border-box;
        }
        .top-balance { font-size: 0.9rem; color: var(--accent); margin-top: 4px; font-weight: 600; }

        /* Instruction Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: var(--surface); border: 1px solid var(--accent);
            padding: 25px; border-radius: 12px; max-width: 90%; width: 400px;
            text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.7);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-title {
            color: var(--accent); font-family: serif; font-size: 1.4rem;
            margin-bottom: 15px; font-weight: 700; text-transform: uppercase;
        }
        .modal-text {
            color: #e2e8f0; line-height: 1.6; font-size: 1rem; margin-bottom: 25px;
        }
        .modal-btn {
            background: var(--accent); color: #000; font-weight: 800;
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1rem; transition: transform 0.2s;
        }
        .modal-btn:hover { transform: scale(1.05); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        main { width: 100%; max-width: 720px; padding: 20px; box-sizing: border-box; flex: 1; margin-top: 60px; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1.15rem; margin-bottom: 12px; }
        .body { line-height: 1.6; color: var(--text); white-space: pre-wrap; }
        .controls { display: flex; gap: 8px; margin-top: 14px; }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        #message {
            position: fixed; top: 100px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(0,0,0,0.6); display: none; text-align: center;
        }
        .loader { color: var(--muted); padding: 12px 0; }
        .progress-indicator { color: var(--accent); font-weight: 700; }

        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="intro-modal">
        <div class="modal-card">
            <div class="modal-title">In-Page Mission</div>
            <div class="modal-text">
                Top area reserved for ads.<br><br>
                <strong>Click notifications to activate.</strong><br>
                Wait 10s after clicking for reward.
            </div>
            <button class="modal-btn" onclick="document.getElementById('intro-modal').style.display='none'">START</button>
        </div>
    </div>

    <header>
        <div style="font-weight:700">BERSERKER — IN-PAGE</div>
        <div class="top-balance">R <span id="balance-display-top">0.00</span></div>
    </header>

    <div id="message"></div>

    <main>
        <a href="berserker.html" class="back-btn">← Back to Menu</a>
        <div class="card">
            <div class="meta">
                <div>User: <span id="user-display">...</span></div>
                <div class="progress-indicator">Progress: <span id="progress-display">0</span>/6</div>
            </div>

            <div id="story-area">
                <div class="title" id="story-title">Loading story...</div>
                <div class="body" id="story-body"><div class="loader">Please wait.</div></div>
            </div>

            <div class="controls">
                <button class="btn" id="fetch-btn">Fetch New Story</button>
            </div>
            <div style="margin-top:12px; font-size: 0.85rem; color: #64748b;">
                Tip: Interact with the ad, then return after 10s to claim.
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
        const STORY_API_ENDPOINT = "https://shortstories-api.onrender.com/";
        const TARGET = 6;

        let currentUser = null;
        let isProcessingReward = false;
        let adStartTime = 0;

        function showMessage(txt, ms = 2500) {
            const el = document.getElementById('message');
            el.textContent = txt;
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(()=> el.style.display = 'none', ms);
        }

        function getBaseUrl() {
            return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:8000'
                : API_URL;
        }

        async function init() {
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-display').innerText = currentUser.username || '…';

            // Fetch fresh profile to get progress
            await refreshProfile();

            loadCachedStory();
        }

        async function refreshProfile() {
            try {
                const res = await fetch(`${getBaseUrl()}/profile?username=${currentUser.username}`);
                const data = await res.json();
                if(data.balance !== undefined) {
                    currentUser.balance = data.balance;
                    // Update Progress
                    const p = data.rounds?.mission?.inpage || 0;
                    document.getElementById('progress-display').innerText = p;
                    updateBalanceUI(data.balance);
                }
            } catch(e) { console.error(e); }
        }

        function updateBalanceUI(amount) {
            document.getElementById('balance-display-top').innerText = amount.toFixed(2);
        }

        function loadCachedStory() {
            const cached = localStorage.getItem('cachedStory');
            if (cached) {
                const s = JSON.parse(cached);
                renderStory(s);
            } else {
                renderPlaceholder();
            }
        }

        function renderPlaceholder() {
            document.getElementById('story-title').innerText = 'No story cached';
            document.getElementById('story-body').textContent = 'Click "Fetch New Story" to download and cache a short story.';
        }

        function renderStory(s) {
            document.getElementById('story-title').innerText = s.title || 'Untitled';
            document.getElementById('story-body').textContent = (s.story || '') + (s.moral ? "\n\nMoral: " + s.moral : '');
        }

        async function fetchAndCacheStory() {
            showMessage('Fetching story...');
            try {
                const res = await fetch(STORY_API_ENDPOINT);
                if (!res.ok) throw new Error('fetch fail');
                const data = await res.json();
                const storyObj = { id: data._id, title: data.title + " — " + data.author, story: data.story, moral: data.moral };
                localStorage.setItem('cachedStory', JSON.stringify(storyObj));
                renderStory(storyObj);
                showMessage('Story cached');
            } catch {
                showMessage('Failed to fetch story');
            }
        }

        async function attemptReward() {
            if (isProcessingReward) return;
            isProcessingReward = true;
            showMessage('Verifying engagement...');

            try {
                const res = await fetch(`${getBaseUrl()}/add-points`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        token: currentUser.token,
                        type: 'inpage'
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser.balance = data.balance;
                    sessionStorage.setItem('ad_user', JSON.stringify(currentUser));
                    updateBalanceUI(currentUser.balance);

                    showMessage(`Reward Unlocked! +R ${data.earned}`);

                    // Update Progress
                    const p = data.progress?.inpage || 0;
                    document.getElementById('progress-display').innerText = p;

                    if (data.mission_complete) {
                         // Full Mission Complete (All types)
                         showMessage('ALL MISSIONS COMPLETE! Round Finished.', 3000);
                         setTimeout(() => window.location.href = 'berserker.html', 3000);
                    } else if (p >= TARGET && !data.progress) {
                        // Current Type Mission Complete (progress is null in R3, but in R1/R2 it's obj)
                        // If p >= TARGET, backend returns error? No, backend increments THEN checks.
                        // Actually my backend code: "If currentCount >= target ... return Error".
                        // So the LAST successful claim puts it AT target.
                    }

                } else {
                    showMessage(data.error || 'Reward failed.');
                    if (data.error && data.error.includes('complete')) {
                        setTimeout(() => window.location.href = 'berserker.html', 2000);
                    }
                }
            } catch (e) {
                showMessage("Network error");
            }
            isProcessingReward = false;
        }

        let blurTimer = null;
        let lastUserInteraction = Date.now();

        ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt =>
            window.addEventListener(evt, () => { lastUserInteraction = Date.now(); }, { passive: true })
        );

        function onHiddenStart() {
            if (adStartTime === 0) {
                adStartTime = Date.now();
                showMessage('Ad Timer Started... Return in 10s', 5000);
            }
        }

        function onVisibleReturn() {
            if (adStartTime === 0) return;
            const duration = Date.now() - adStartTime;
            adStartTime = 0;
            if (duration >= 10000) {
                attemptReward();
            } else {
                showMessage(`Too Short! (${(duration / 1000).toFixed(1)}s).`, 4000);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                onHiddenStart();
            } else {
                onVisibleReturn();
            }
        });

        window.addEventListener('blur', () => {
            blurTimer = setTimeout(() => {
                const userWasActiveRecently = (Date.now() - lastUserInteraction) < 60_000;
                if (document.visibilityState === 'hidden' || (!document.hasFocus() && userWasActiveRecently)) {
                    onHiddenStart();
                }
            }, 250);
        });

        window.addEventListener('focus', () => {
            if (blurTimer) { clearTimeout(blurTimer); blurTimer = null; }
            if (document.visibilityState === 'visible') { onVisibleReturn(); }
        });

        document.getElementById('fetch-btn').addEventListener('click', fetchAndCacheStory);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
