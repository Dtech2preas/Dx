<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Pending - DTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #d4af37;
            --primary: #3b82f6;
            --radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 2rem;
            color: var(--accent);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--text);
            margin: 0 0 15px;
            font-size: 1.6rem;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .status-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-circle">⏳</div>
        <h1>Approval Pending</h1>

        <p>
            Thank you for registering with DTech Rewards. Your account is currently under review by our administration team.
        </p>

        <p>
            This process ensures the integrity of our reward system and typically takes <strong>1 to 4 hours</strong>.
        </p>

        <div class="status-box">
            Status: Awaiting Verification
        </div>

        <a href="index.html" class="btn">Return to Login</a>
    </div>

</body>
</html>
