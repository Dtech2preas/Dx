<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DTech Admin Console</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #d4af37;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --danger: #dc2626;
            --success: #059669;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--primary); }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius);
            box-sizing: border-box;
        }

        button {
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        button:hover { opacity: 0.9; }

        button.action { background: var(--accent); color: var(--primary); }
        button.danger { background: var(--danger); }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
        }
        .stat-val { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; color: #64748b; }

        .preview-area {
            border: 2px dashed #cbd5e1;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .preview-area img { max-width: 100%; max-height: 400px; border: 1px solid #ccc; }

        .status-paid { color: var(--success); font-weight: bold; }
        .status-pending { color: var(--accent); font-weight: bold; }

        #login-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="card" style="width: 300px; text-align: center;">
        <h3>Admin Access</h3>
        <input type="password" id="admin-secret" placeholder="Enter Secret Key" />
        <button onclick="unlock()">Unlock Console</button>
    </div>
</div>

<div class="container" style="display:none;" id="main-content">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1>DTech Admin</h1>
        <button onclick="location.reload()" style="width:auto; padding:8px 16px; font-size:0.8rem;">Lock</button>
    </header>

    <!-- STATS -->
    <div class="card">
        <h2>Financial Overview</h2>
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Total Monthly Limit</div>
                <div class="stat-val">R 500.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Paid This Month</div>
                <div class="stat-val" id="stat-paid">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Pending Liability</div>
                <div class="stat-val" id="stat-liability">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Remaining Budget</div>
                <div class="stat-val" id="stat-remaining" style="color:var(--success);">...</div>
            </div>
        </div>
        <button onclick="loadStats()" style="margin-top:15px; background:transparent; color:#666; border:1px solid #ccc;">Refresh Data</button>
    </div>

    <!-- CERT VERIFIER -->
    <div class="card">
        <h2>Certificate Validator</h2>

        <label>1. Upload Image to Inspect (Optional)</label>
        <div class="preview-area" id="drop-zone">
            <input type="file" id="cert-file" accept="image/*" onchange="previewFile()" />
            <div id="preview-container"></div>
        </div>

        <label>2. Certificate ID (e.g. CERT-ABCD-1234)</label>
        <input type="text" id="cert-id" placeholder="Enter ID from certificate" />

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button onclick="verifyCert()">Check Status</button>
            <button class="action" onclick="markPaid()">AUTHORIZE PAYOUT</button>
        </div>

        <div id="verify-result" style="margin-top:20px; padding:15px; background:#f1f5f9; border-left:4px solid var(--primary); display:none;"></div>
    </div>
</div>

<script>
    const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev"; // Adjust if needed
    let SECRET = "";

    function unlock() {
        const val = document.getElementById('admin-secret').value;
        if(val) {
            SECRET = val;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadStats();
        }
    }

    async function fetchJson(path, method = 'GET', body = null) {
        const baseUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                      ? 'http://localhost:8000' // Dev
                      : API_URL; // Prod

        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'X-Admin-Secret': SECRET
            }
        };
        if(body) opts.body = JSON.stringify(body);

        try {
            const res = await fetch(baseUrl + path, opts);
            const data = await res.json();
            return { ok: res.ok, data };
        } catch(e) {
            return { ok: false, data: { error: e.message } };
        }
    }

    async function loadStats() {
        const { ok, data } = await fetchJson('/admin-stats');
        if(ok) {
            const paid = data.paid || 0;
            const liability = data.liability || 0;
            const remaining = 500 - (paid + liability);

            document.getElementById('stat-paid').innerText = `R ${paid.toFixed(2)}`;
            document.getElementById('stat-liability').innerText = `R ${liability.toFixed(2)}`;

            const remEl = document.getElementById('stat-remaining');
            remEl.innerText = `R ${remaining.toFixed(2)}`;
            remEl.style.color = remaining < 0 ? 'red' : 'green';
        } else {
            alert("Failed to load stats. Check secret.");
        }
    }

    function previewFile() {
        const file = document.getElementById('cert-file').files[0];
        const container = document.getElementById('preview-container');
        container.innerHTML = '';
        if(file) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            container.appendChild(img);

            // Scan for QR
            const reader = new FileReader();
            reader.onload = function(e) {
                const image = new Image();
                image.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = image.width;
                    canvas.height = image.height;
                    context.drawImage(image, 0, 0);

                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if(code) {
                        console.log("QR Code found:", code.data);
                        document.getElementById('cert-id').value = code.data;
                        // Optional: automatically verify
                        verifyCert();
                        alert("QR Code Detected: " + code.data);
                    } else {
                        console.log("No QR Code found.");
                    }
                };
                image.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    async function verifyCert() {
        const id = document.getElementById('cert-id').value.trim();
        if(!id) return alert("Enter ID");

        const res = await fetchJson(`/certificate?id=${id}`);
        const out = document.getElementById('verify-result');
        out.style.display = 'block';

        if(res.ok) {
            const c = res.data;
            out.innerHTML = `
                <div style="font-size:1.1rem; margin-bottom:10px;">
                    Status: <span class="${c.status === 'paid' ? 'status-paid' : 'status-pending'}">${c.status.toUpperCase()}</span>
                </div>
                <div><strong>User:</strong> ${c.username}</div>
                <div><strong>Amount:</strong> R ${c.amount ? c.amount.toFixed(2) : '20.00 (Legacy)'}</div>
                <div><strong>Date:</strong> ${new Date(c.date).toLocaleString()}</div>
            `;
        } else {
            out.innerHTML = `<span style="color:red">Error: ${res.data.error}</span>`;
        }
    }

    async function markPaid() {
        const id = document.getElementById('cert-id').value.trim();
        if(!id) return alert("Enter ID");
        if(!confirm("Are you sure you have paid this user? This action updates the financial budget.")) return;

        const res = await fetchJson('/mark-cert-paid', 'POST', { id, admin_secret: SECRET });

        if(res.ok) {
            alert("Success! Marked as paid.");
            verifyCert();
            loadStats();
        } else {
            alert("Error: " + res.data.error);
        }
    }
</script>

</body>
</html>
