<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DTech Admin Console</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #d4af37;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --danger: #dc2626;
            --success: #059669;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--primary); }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
        }

        /* --- Scanner Styles --- */
        .scanner-box {
            border: 3px dashed #cbd5e1;
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            background: #f8fafc;
        }

        .scanner-box:hover {
            border-color: var(--primary);
            background: #f1f5f9;
        }

        .scanner-box.drag-over {
            border-color: var(--accent);
            background: #fffbeb;
        }

        .scanner-box.success {
            border-color: var(--success);
            background: #f0fdf4;
        }

        .scanner-box.error {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .scanner-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .scanner-text {
            font-weight: 600;
            color: var(--text-main);
        }

        .scanner-sub {
            font-size: 0.85rem;
            color: #64748b;
        }

        /* Hidden file input */
        #cert-file {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* --- Inputs & Buttons --- */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        button {
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover { opacity: 0.9; }

        button.action { background: var(--accent); color: var(--primary); font-weight: 800; }
        button.secondary { background: transparent; color: var(--text-main); border: 1px solid #cbd5e1; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
        }
        .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #64748b; }

        .status-paid { color: var(--success); font-weight: bold; }
        .status-pending { color: var(--accent); font-weight: bold; }

        #login-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(15, 23, 42, 0.98);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        /* Manual Toggle */
        .manual-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="card" style="width: 300px; text-align: center;">
        <h3>Admin Access</h3>
        <input type="password" id="admin-secret" placeholder="Enter Secret Key" />
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="font-size: 0.9rem; color: #64748b; display: flex; align-items: center;">
                <input type="checkbox" id="remember-me" style="width: auto; margin-right: 8px;"> Remember Me
            </label>
        </div>
        <button onclick="unlock()">Unlock Console</button>
    </div>
</div>

<div class="container" style="display:none;" id="main-content">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1 style="font-size:1.5rem; margin:0;">DTech Admin</h1>
        <button onclick="location.reload()" style="width:auto; padding:6px 12px; font-size:0.75rem;" class="secondary">Lock</button>
    </header>

    <div class="card">
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Pending Liability</div>
                <div class="stat-val" id="stat-liability">...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Budget Remaining</div>
                <div class="stat-val" id="stat-remaining" style="color:var(--success);">...</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="text-align:center; margin-bottom: 20px;">Certificate Scanner</h2>

        <div class="scanner-box" id="drop-zone">
            <div class="scanner-icon">📸</div>
            <div class="scanner-text" id="scanner-text">Upload Certificate Image</div>
            <div class="scanner-sub" id="scanner-sub">Tap or Drag & Drop to Scan QR</div>
            <input type="file" id="cert-file" accept="image/*" onchange="handleFile(this.files)" />
        </div>

        <div id="verify-result" style="margin-top:20px; padding:15px; background:#f0f9ff; border: 1px solid #bae6fd; border-radius:6px; display:none; text-align:center;">
            </div>

        <div id="action-buttons" style="display:none; margin-top:20px; gap:10px;">
            <button class="action" onclick="markPaid()">✅ AUTHORIZE PAYOUT</button>
            <button class="secondary" onclick="resetScanner()">Scan Next</button>
        </div>

        <div style="text-align:center; margin-top:15px;">
            <a href="#" onclick="toggleManual(); return false;" style="font-size:0.8rem; color:#94a3b8; text-decoration:none;">Input ID Manually</a>
        </div>

        <div id="manual-input-area" class="manual-section">
            <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:5px;">Manual Verification</label>
            <input type="text" id="cert-id" placeholder="CERT-XXXX-XXXX" />
            <button onclick="verifyCert()" class="secondary">Check ID</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
    let SECRET = "";

    // --- AUTH ---
    function unlock() {
        const val = document.getElementById('admin-secret').value;
        const remember = document.getElementById('remember-me').checked;

        if(val) {
            SECRET = val;
            if(remember) {
                localStorage.setItem('dtech_admin_secret', val);
            } else {
                localStorage.removeItem('dtech_admin_secret');
            }
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadStats();
        }
    }

    // Auto-Login
    window.addEventListener('load', () => {
        const saved = localStorage.getItem('dtech_admin_secret');
        if(saved) {
            SECRET = saved;
            document.getElementById('admin-secret').value = saved;
            // Auto unlock
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadStats();
        }
    });

    // --- API HELPER ---
    async function fetchJson(path, method = 'GET', body = null) {
        const baseUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                      ? 'http://localhost:8000'
                      : API_URL;

        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'X-Admin-Secret': SECRET
            }
        };
        if(body) opts.body = JSON.stringify(body);

        try {
            const res = await fetch(baseUrl + path, opts);
            const data = await res.json();
            return { ok: res.ok, data };
        } catch(e) {
            return { ok: false, data: { error: e.message } };
        }
    }

    // --- STATS ---
    async function loadStats() {
        const { ok, data } = await fetchJson('/admin-stats');
        if(ok) {
            const paid = data.paid || 0;
            const liability = data.liability || 0;
            const remaining = 500 - (paid + liability);

            document.getElementById('stat-liability').innerText = `R ${liability.toFixed(2)}`;
            const remEl = document.getElementById('stat-remaining');
            remEl.innerText = `R ${remaining.toFixed(2)}`;
            remEl.style.color = remaining < 0 ? 'var(--danger)' : 'var(--success)';
        }
    }

    // --- SCANNER LOGIC ---
    function handleFile(files) {
        if(!files || !files[0]) return;
        const file = files[0];

        // UI Updates
        const zone = document.getElementById('drop-zone');
        const text = document.getElementById('scanner-text');
        text.innerText = "Analyzing...";
        zone.className = "scanner-box"; // Reset classes

        const reader = new FileReader();
        reader.onload = function(e) {
            const image = new Image();
            image.onload = function() {
                // Draw to hidden canvas to read pixels
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = image.width;
                canvas.height = image.height;
                context.drawImage(image, 0, 0);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                
                // --- JSQR SCAN ---
                const runScan = (data, w, h, label) => {
                     const res = jsQR(data, w, h, { inversionAttempts: "dontInvert" });
                     if (res) console.log(`QR Found via: ${label}`);
                     return res;
                };

                // 1. Standard Scan (with library inversion)
                let code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "attemptBoth"
                });

                // 2. Custom Preprocessing Strategies
                if (!code) {
                    console.log("Standard scan failed. Trying custom preprocessing...");
                    const originalData = imageData.data; // Reference to original
                    const len = originalData.length;

                    // Strategy A: Threshold Invert (Dark -> White, Light -> Black)
                    // Good for white QR on dark background
                    const attemptThreshold = (threshold) => {
                        const buffer = new Uint8ClampedArray(len);
                        for (let i = 0; i < len; i += 4) {
                            const avg = (originalData[i] + originalData[i+1] + originalData[i+2]) / 3;
                            // If dark (bg), make white (255). If light (fg), make black (0).
                            const val = avg < threshold ? 255 : 0;
                            buffer[i] = buffer[i+1] = buffer[i+2] = val;
                            buffer[i+3] = 255;
                        }
                        return runScan(buffer, imageData.width, imageData.height, `Threshold ${threshold}`);
                    };

                    // Try multiple thresholds
                    code = attemptThreshold(60) || attemptThreshold(100) || attemptThreshold(150);

                    // Strategy B: Pure Inversion (preserves gradients)
                    if (!code) {
                         const buffer = new Uint8ClampedArray(len);
                         for (let i = 0; i < len; i += 4) {
                            buffer[i] = 255 - originalData[i];
                            buffer[i+1] = 255 - originalData[i+1];
                            buffer[i+2] = 255 - originalData[i+2];
                            buffer[i+3] = 255;
                        }
                        code = runScan(buffer, imageData.width, imageData.height, "Pure Inversion");
                    }
                }

                if(code) {
                    // Success
                    console.log("QR Found:", code.data);

                    // Parse ID from QR format: DTECH_CERT:<ID>:<USERNAME>:...
                    let certId = code.data;
                    if (certId.startsWith('DTECH_CERT:')) {
                        const parts = certId.split(':');
                        if (parts.length >= 2) {
                            certId = parts[1];
                        }
                    }

                    document.getElementById('cert-id').value = certId;
                    
                    zone.className = "scanner-box success";
                    text.innerText = "QR Detected!";
                    document.getElementById('scanner-sub').innerText = certId;
                    
                    // Auto Trigger Verification
                    verifyCert();
                } else {
                    // Fail
                    zone.className = "scanner-box error";
                    text.innerText = "No QR Code Found";
                    document.getElementById('scanner-sub').innerText = "Please try again or use manual input below.";
                    toggleManual(true); // Open manual input
                }
            };
            image.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- VERIFICATION ---
    async function verifyCert() {
        const id = document.getElementById('cert-id').value.trim();
        if(!id) return;

        const res = await fetchJson(`/certificate?id=${id}`);
        const out = document.getElementById('verify-result');
        const btns = document.getElementById('action-buttons');
        
        out.style.display = 'block';

        if(res.ok) {
            const c = res.data;
            const isPaid = c.status === 'paid';
            
            // Build Result UI
            const fee = c.fee || 0;
            const payout = c.payout || c.amount || 0;
            const method = c.method || 'Unknown';

            out.innerHTML = `
                <div style="font-size:0.9rem; color:#64748b; margin-bottom:5px;">CERTIFICATE FOUND</div>
                <div style="margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                    <div style="font-size:0.8rem; color:#64748b;">NET PAYOUT</div>
                    <div style="font-size:2rem; font-weight:bold; color:var(--primary);">
                        R ${payout.toFixed(2)}
                    </div>
                    <div style="font-size:0.8rem; color:#94a3b8;">Method: ${method}</div>
                </div>

                <div style="display:flex; justify-content:space-around; margin-bottom:15px; font-size:0.9rem;">
                    <div>Gross: <strong>R ${c.amount ? c.amount.toFixed(2) : '0.00'}</strong></div>
                    <div>Fee: <span style="color:var(--danger);">R ${fee.toFixed(2)}</span></div>
                </div>

                <div style="margin-bottom:10px;">User: <strong>${c.username}</strong></div>
                <div style="display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.8rem; background:${isPaid ? '#ecfdf5' : '#fffbeb'}; color:${isPaid ? 'var(--success)' : 'var(--accent)'}; border:1px solid currentColor;">
                    ${c.status.toUpperCase()}
                </div>
            `;

            // Only show PAYOUT button if not paid
            btns.style.display = 'flex';
            if(isPaid) {
                btns.innerHTML = `<button class="secondary" onclick="resetScanner()">Scan Next</button>`;
            } else {
                btns.innerHTML = `
                    <button class="action" onclick="markPaid()">AUTHORIZE PAYOUT</button>
                    <button class="secondary" onclick="resetScanner()">Cancel</button>
                `;
            }

        } else {
            out.innerHTML = `<span style="color:var(--danger); font-weight:bold;">❌ Error: ${res.data.error || 'Certificate not found'}</span>`;
            btns.style.display = 'none';
        }
    }

    // --- PAYOUT ACTION ---
    async function markPaid() {
        const id = document.getElementById('cert-id').value.trim();
        if(!confirm(`Confirm payout for ${id}?`)) return;

        const res = await fetchJson('/mark-cert-paid', 'POST', { id, admin_secret: SECRET });

        if(res.ok) {
            // Update UI to show Success
            const out = document.getElementById('verify-result');
            out.innerHTML = `
                <div style="color:var(--success); font-weight:bold; font-size:1.2rem;">✅ PAYOUT SUCCESSFUL</div>
                <p>Database updated.</p>
            `;
            document.getElementById('action-buttons').innerHTML = `<button class="secondary" onclick="resetScanner()">Scan Next</button>`;
            loadStats();
        } else {
            alert("Error: " + res.data.error);
        }
    }

    // --- UI HELPERS ---
    function toggleManual(forceOpen = false) {
        const el = document.getElementById('manual-input-area');
        if(forceOpen) {
            el.style.display = 'block';
        } else {
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }
    }

    function resetScanner() {
        document.getElementById('cert-id').value = '';
        document.getElementById('cert-file').value = ''; // Reset file input
        document.getElementById('verify-result').style.display = 'none';
        document.getElementById('action-buttons').style.display = 'none';
        
        // Reset Visuals
        const zone = document.getElementById('drop-zone');
        zone.className = "scanner-box";
        document.getElementById('scanner-text').innerText = "Upload Certificate Image";
        document.getElementById('scanner-sub').innerText = "Tap or Drag & Drop to Scan QR";
    }
</script>

</body>
</html>
