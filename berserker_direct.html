<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berserker - Stage 5</title>

    <!-- Stage 5: Direct Links (No Ad Tag) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050617;
            --surface: #0f172a;
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #d4af37;
            --radius: 10px;
        }
        html, body { height: 100% }
        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        header { width: 100%; padding: 14px 0; text-align: center; background: var(--surface); border-bottom: 2px solid rgba(255,255,255,0.03); }
        .top-balance { font-size: 0.9rem; color: var(--accent); margin-top: 4px; font-weight: 600; }

        /* Health Bar */
        #health-bar-container {
            width: 100%; max-width: 720px; height: 6px; background: rgba(255,255,255,0.1);
            margin: 0 auto; overflow: hidden; position: relative;
        }
        #health-bar {
            height: 100%; width: 0%; background: #22c55e;
            transition: width 0.5s linear, background 0.3s ease;
        }

        main { width: 100%; max-width: 720px; padding: 20px; box-sizing: border-box; flex: 1; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1.15rem; margin-bottom: 12px; }

        .link-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .link-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .link-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .link-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: transparent; }
        .badge { background: var(--accent); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }

        #message {
            position: fixed; top: 72px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(0,0,0,0.6); display: none; text-align: center;
        }
        .progress-indicator { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:700">BERSERKER — DIRECT MODE</div>
        <div class="top-balance">R <span id="balance-display-top">0.00</span></div>
    </header>

    <div id="health-bar-container">
        <div id="health-bar"></div>
    </div>

    <div id="message"></div>

    <main>
        <div class="card">
            <div class="meta">
                <div>User: <span id="user-display">...</span></div>
                <div class="progress-indicator">Tasks: <span id="total-progress">0</span>/20</div>
            </div>

            <div class="title">Complete All Tasks</div>
            <p style="color:var(--muted); font-size:0.9rem;">Click each link and view for 10 seconds. You must complete each link 5 times.</p>

            <div class="link-grid" id="link-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
        const LINKS = [
            { id: 1, url: 'https://otieu.com/4/10250311' },
            { id: 2, url: 'https://otieu.com/4/9515888' },
            { id: 3, url: 'https://otieu.com/4/10205357' },
            { id: 4, url: 'https://otieu.com/4/10358600' }
        ];
        const CLICKS_PER_LINK = 3;

        let currentUser = null;
        let isProcessingReward = false;
        let lastClaimTime = Date.now();
        let adStartTime = 0;
        let activeLinkId = null; // ID of the link currently being visited

        // Format: { "1": 0, "2": 3, ... }
        let stageProgress = {};

        function showMessage(txt, ms = 2500) {
            const el = document.getElementById('message');
            el.textContent = txt;
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(()=> el.style.display = 'none', ms);
        }

        function getBaseUrl() {
            return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:8000'
                : API_URL;
        }

        async function fetchJson(path, opts = {}) {
            const url = `${getBaseUrl()}${path}`;
            const defaultHeaders = { 'Content-Type': 'application/json' };
            const safeOpts = Object.assign({ headers: defaultHeaders }, opts);
            try {
                const res = await fetch(url, safeOpts);
                let data = null;
                try { data = await res.json(); } catch(e){}
                return { ok: res.ok, status: res.status, data };
            } catch {
                return { ok: false, status: 0, data: null };
            }
        }

        function init() {
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-display').innerText = currentUser.username || '…';
            updateBalanceUI(currentUser.balance || 0);

            const storedTime = localStorage.getItem('lastClaimTime');
            if (storedTime) lastClaimTime = parseInt(storedTime);

            // Restore Progress
            try {
                stageProgress = JSON.parse(sessionStorage.getItem('stage_progress_direct') || '{}');
            } catch { stageProgress = {}; }

            // Initialize progress for new IDs
            LINKS.forEach(l => {
                if (stageProgress[l.id] === undefined) stageProgress[l.id] = 0;
            });

            renderButtons();
            startHealthBar();
        }

        function updateBalanceUI(amount) {
            document.getElementById('balance-display-top').innerText = amount.toFixed(2);
        }

        function renderButtons() {
            const container = document.getElementById('link-container');
            container.innerHTML = '';

            let totalDone = 0;

            LINKS.forEach((link, idx) => {
                const count = stageProgress[link.id] || 0;
                totalDone += count;
                const isComplete = count >= CLICKS_PER_LINK;

                const btn = document.createElement('button');
                btn.className = 'link-btn';
                btn.disabled = isComplete;
                btn.innerHTML = `
                    <span>Task #${idx + 1}</span>
                    <span class="badge">${count}/${CLICKS_PER_LINK}</span>
                `;

                btn.onclick = () => handleLinkClick(link.id, link.url);
                container.appendChild(btn);
            });

            document.getElementById('total-progress').innerText = totalDone;

            // Check completion
            if (totalDone >= (LINKS.length * CLICKS_PER_LINK)) {
                setTimeout(() => {
                    showMessage('All Tasks Complete! Rotating...');
                    sessionStorage.removeItem('stage_progress_direct');
                    let idx = parseInt(sessionStorage.getItem('berserker_index') || '0');
                    sessionStorage.setItem('berserker_index', (idx + 1).toString());
                    window.location.href = 'berserker.html';
                }, 2000);
            }
        }

        function handleLinkClick(id, url) {
            activeLinkId = id;
            window.open(url, '_blank');
            showMessage('Timer Started... Return after 10s.');
            // Blur event will fire naturally when tab opens
        }

        function startHealthBar() {
            const bar = document.getElementById('health-bar');
            setInterval(() => {
                const now = Date.now();
                const elapsed = (now - lastClaimTime) / 1000;
                let pct = 0;
                let color = '#ef4444';
                if (elapsed < 30) {
                    pct = (elapsed / 30) * 33;
                    color = '#ef4444';
                } else if (elapsed < 60) {
                    pct = 33 + ((elapsed - 30) / 30) * 33;
                    color = '#eab308';
                } else {
                    pct = 66 + ((elapsed - 60) / 30) * 34;
                    if (pct > 100) pct = 100;
                    color = '#22c55e';
                }
                bar.style.width = pct + '%';
                bar.style.background = color;
            }, 100);
        }

        async function attemptReward() {
            if (isProcessingReward) return;
            if (!activeLinkId) return; // Must have clicked a link

            isProcessingReward = true;
            showMessage('Verifying engagement...');

            const res = await fetchJson('/add-points', {
                method: 'POST',
                body: JSON.stringify({
                    username: currentUser.username,
                    token: currentUser.token
                })
            });

            if (res.ok) {
                currentUser.balance = res.data.balance;
                sessionStorage.setItem('ad_user', JSON.stringify(currentUser));
                updateBalanceUI(currentUser.balance);

                lastClaimTime = Date.now();
                localStorage.setItem('lastClaimTime', lastClaimTime);

                const status = res.data.speed_status;
                if (status === 'red') {
                    showMessage(`Warning: Too Fast! +R ${res.data.earned} (Penalty)`);
                } else {
                     showMessage(`Task Complete! +R ${res.data.earned}`);
                }

                // Update Progress
                stageProgress[activeLinkId]++;
                sessionStorage.setItem('stage_progress_direct', JSON.stringify(stageProgress));
                activeLinkId = null; // Reset
                renderButtons();

            } else {
                showMessage(res.data?.error || 'Reward failed.');
            }
            isProcessingReward = false;
        }

        window.addEventListener('blur', () => {
            if (activeLinkId) {
                adStartTime = Date.now();
            }
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0 && activeLinkId) {
                const duration = Date.now() - adStartTime;
                adStartTime = 0;

                if (duration >= 10000) {
                    attemptReward();
                } else {
                    showMessage(`Too Short! (${(duration/1000).toFixed(1)}s). Watch for 10s+.`, 4000);
                    activeLinkId = null; // Reset to force re-click
                }
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
