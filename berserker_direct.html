<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berserker - Direct Mode</title>

    <!-- Stage 5: Direct Links (No Ad Tag) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050617;
            --surface: #0f172a;
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #d4af37;
            --radius: 10px;
        }
        html, body { height: 100% }
        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        header { width: 100%; padding: 14px 0; text-align: center; background: var(--surface); border-bottom: 2px solid rgba(255,255,255,0.03); }
        .top-balance { font-size: 0.9rem; color: var(--accent); margin-top: 4px; font-weight: 600; }

        main { width: 100%; max-width: 720px; padding: 20px; box-sizing: border-box; flex: 1; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1.15rem; margin-bottom: 12px; }

        .link-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .link-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .link-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .link-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: transparent; }
        .badge { background: var(--accent); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }

        .status-done { background: #22c55e; color: #fff; }
        .status-locked { background: #334155; color: #94a3b8; }

        #message {
            position: fixed; top: 72px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(0,0,0,0.6); display: none; text-align: center;
        }
        .progress-indicator { color: var(--accent); font-weight: 700; }

        .back-btn { display: inline-block; margin-bottom: 15px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }

        /* Instruction Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: var(--surface); border: 1px solid var(--accent);
            padding: 25px; border-radius: 12px; max-width: 90%; width: 400px;
            text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.7);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-title {
            color: var(--accent); font-family: serif; font-size: 1.4rem;
            margin-bottom: 15px; font-weight: 700; text-transform: uppercase;
        }
        .modal-text {
            color: #e2e8f0; line-height: 1.6; font-size: 1rem; margin-bottom: 25px;
        }
        .modal-btn {
            background: var(--accent); color: #000; font-weight: 800;
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1rem; transition: transform 0.2s;
        }
        .modal-btn:hover { transform: scale(1.05); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="modal-overlay" id="intro-modal">
        <div class="modal-card">
            <div class="modal-title">Direct Mission</div>
            <div class="modal-text">
                Complete tasks in order.<br>
                <strong>1 click per button required.</strong><br>
                Wait 10s on the page for each click.
            </div>
            <button class="modal-btn" onclick="document.getElementById('intro-modal').style.display='none'">START</button>
        </div>
    </div>

    <header>
        <div style="font-weight:700">BERSERKER — DIRECT</div>
        <div class="top-balance" style="font-size:0.8rem;">Pending: R <span id="balance-display-top">0.00</span></div>
    </header>

    <div id="message"></div>

    <main>
        <a href="berserker.html" class="back-btn">← Back to Menu</a>
        <div class="card">
            <div class="meta">
                <div>User: <span id="user-display">...</span></div>
                <div class="progress-indicator">Progress: <span id="total-progress">0</span>/4</div>
            </div>

            <div class="title">Complete All Tasks</div>
            <p style="color:var(--muted); font-size:0.9rem;">Click each link and view for 10 seconds.</p>

            <div class="link-grid" id="link-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
        const LINKS = [
            { id: 1, url: '' },
            { id: 2, url: '' },
            { id: 3, url: '' },
            { id: 4, url: '' }
        ];

        let currentUser = null;
        let isProcessingReward = false;
        let adStartTime = 0;
        let activeLinkId = null;
        let serverProgress = 0;
        let currentRound = 1;

        function showMessage(txt, ms = 2500) {
            const el = document.getElementById('message');
            el.textContent = txt;
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(()=> el.style.display = 'none', ms);
        }

        function getBaseUrl() {
            return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:8000'
                : API_URL;
        }

        async function init() {
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-display').innerText = currentUser.username || '…';

            await refreshProfile();
        }

        async function refreshProfile() {
            try {
                const res = await fetch(`${getBaseUrl()}/profile?username=${currentUser.username}`);
                const data = await res.json();
                if(data.balance !== undefined) {
                    currentUser.balance = data.balance;
                    currentUser.balance_pending = data.balance_pending || 0;
                    updateBalanceUI(currentUser.balance_pending);

                    // Use Server Progress directly
                    // Note: R3 returns null for mission progress usually, but we assume R1/R2 structure
                    const p = data.rounds?.mission?.direct || 0;
                    serverProgress = p;
                    currentRound = data.rounds?.current || 1;
                    document.getElementById('total-progress').innerText = (currentRound === 3) ? '∞' : p;

                    // Update Links
                    if (data.ad_set && data.ad_set.direct && data.ad_set.direct.link) {
                        const dl = data.ad_set.direct.link;
                        LINKS.forEach(l => l.url = dl);
                    } else {
                        // showMessage("Warning: No Direct Link Assigned.", 5000);
                        // If logic allows, keep running for UI check, but link might be empty
                    }

                    renderButtons();
                }
            } catch(e) {}
        }

        function updateBalanceUI(amount) {
            document.getElementById('balance-display-top').innerText = amount.toFixed(2);
        }

        function renderButtons() {
            const container = document.getElementById('link-container');
            container.innerHTML = '';

            LINKS.forEach((link, idx) => {
                // Logic:
                // Index 0 (Task 1) is active if Progress == 0. Done if Progress > 0.
                // Index 1 (Task 2) is active if Progress == 1. Locked if Progress < 1.

                let state = 'locked';
                let badgeClass = 'status-locked';
                let badgeText = 'LOCKED';

                if (currentRound === 3) {
                    // Round 3: All Active
                    state = 'active';
                    badgeClass = 'badge';
                    badgeText = 'GRIND';
                } else {
                    // Round 1 & 2: Sequential
                    if (idx < serverProgress) {
                        state = 'done';
                        badgeClass = 'status-done';
                        badgeText = 'DONE';
                    } else if (idx === serverProgress) {
                        state = 'active';
                        badgeClass = 'badge';
                        badgeText = 'START';
                    }
                }

                const btn = document.createElement('button');
                btn.className = 'link-btn';
                btn.disabled = (state !== 'active'); // Only active button is clickable

                // If done, also disabled
                if (state === 'done') btn.disabled = true;

                btn.innerHTML = `
                    <span>Task #${idx + 1}</span>
                    <span class="${badgeClass}">${badgeText}</span>
                `;

                if (state === 'active') {
                    btn.onclick = () => handleLinkClick(link.id, link.url);
                }

                container.appendChild(btn);
            });
        }

        function handleLinkClick(id, url) {
            activeLinkId = id;
            if (url) window.open(url, '_blank');
            else window.open('https://google.com', '_blank'); // Fallback if empty
            showMessage('Timer Started... Return after 10s.');
        }

        async function attemptReward() {
            if (isProcessingReward) return;
            if (!activeLinkId) return;

            isProcessingReward = true;
            showMessage('Verifying engagement...');

            try {
                const res = await fetch(`${getBaseUrl()}/add-points`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        token: currentUser.token,
                        type: 'direct'
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser.balance = data.balance;
                    currentUser.balance_pending = data.balance_pending;
                    updateBalanceUI(currentUser.balance_pending);

                    showMessage(`Task Complete! +R ${data.earned}`);

                    // Update Progress from Backend
                    const p = data.progress?.direct || 0;
                    serverProgress = p; // Sync local state
                    document.getElementById('total-progress').innerText = p;

                    activeLinkId = null;
                    renderButtons(); // Re-render to unlock next button

                    if (data.mission_complete) {
                        showMessage('ALL MISSIONS COMPLETE! Round Finished.', 3000);
                        setTimeout(() => window.location.href = 'berserker.html', 3000);
                    }

                } else {
                    showMessage(data.error || 'Reward failed.');
                    if (data.error && data.error.includes('complete')) {
                         setTimeout(() => window.location.href = 'berserker.html', 2000);
                    }
                }
            } catch (e) {
                showMessage("Network error");
            }
            isProcessingReward = false;
        }

        window.addEventListener('blur', () => {
            if (activeLinkId) {
                adStartTime = Date.now();
            }
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0 && activeLinkId) {
                const duration = Date.now() - adStartTime;
                adStartTime = 0;

                if (duration >= 10000) {
                    attemptReward();
                } else {
                    showMessage(`Too Short! (${(duration/1000).toFixed(1)}s).`, 4000);
                    activeLinkId = null;
                }
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
