<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berserker - Stage 1</title>

    <!-- Stage 1: Vignette Ad -->
    <script>(function(s){s.dataset.zone='10504127',s.src='https://gizokraijaw.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050617;
            --surface: #0f172a;
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #d4af37;
            --radius: 10px;
        }
        html, body { height: 100% }
        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        header { width: 100%; padding: 14px 0; text-align: center; background: var(--surface); border-bottom: 2px solid rgba(255,255,255,0.03); }
        .top-balance { font-size: 0.9rem; color: var(--accent); margin-top: 4px; font-weight: 600; }

        /* Health Bar */
        #health-bar-container {
            width: 100%; max-width: 720px; height: 6px; background: rgba(255,255,255,0.1);
            margin: 0 auto; overflow: hidden; position: relative;
        }
        #health-bar {
            height: 100%; width: 0%; background: #22c55e;
            transition: width 0.5s linear, background 0.3s ease;
        }

        main { width: 100%; max-width: 720px; padding: 20px; box-sizing: border-box; flex: 1; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1.15rem; margin-bottom: 12px; }
        .body { line-height: 1.6; color: var(--text); white-space: pre-wrap; }
        .controls { display: flex; gap: 8px; margin-top: 14px; }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        #message {
            position: fixed; top: 72px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(0,0,0,0.6); display: none; text-align: center;
        }
        .loader { color: var(--muted); padding: 12px 0; }
        .progress-indicator { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:700">BERSERKER — VIGNETTE MODE</div>
        <div class="top-balance">R <span id="balance-display-top">0.00</span></div>
    </header>

    <div id="health-bar-container">
        <div id="health-bar"></div>
    </div>

    <div id="message"></div>

    <main>
        <div class="card">
            <div class="meta">
                <div>User: <span id="user-display">...</span></div>
                <div class="progress-indicator">Progress: <span id="progress-display">0</span>/4</div>
            </div>

            <div id="story-area">
                <div class="title" id="story-title">Loading story...</div>
                <div class="body" id="story-body"><div class="loader">Please wait.</div></div>
            </div>

            <div class="controls">
                <button class="btn" id="fetch-btn">Fetch New Story</button>
            </div>
            <div style="margin-top:12px; font-size: 0.85rem; color: #64748b;">
                Tip: Interact with the page/ad, then return after 10s to auto-claim.
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
        const STORY_API_ENDPOINT = "https://shortstories-api.onrender.com/";
        const STAGE_TARGET = 4;

        let currentUser = null;
        let isProcessingReward = false;
        let lastClaimTime = Date.now();
        let adStartTime = 0;
        let stageProgress = 0;

        function showMessage(txt, ms = 2500) {
            const el = document.getElementById('message');
            el.textContent = txt;
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(()=> el.style.display = 'none', ms);
        }

        function getBaseUrl() {
            return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:8000'
                : API_URL;
        }

        async function fetchJson(path, opts = {}) {
            const url = `${getBaseUrl()}${path}`;
            const defaultHeaders = { 'Content-Type': 'application/json' };
            const safeOpts = Object.assign({ headers: defaultHeaders }, opts);
            try {
                const res = await fetch(url, safeOpts);
                let data = null;
                try { data = await res.json(); } catch(e){}
                return { ok: res.ok, status: res.status, data };
            } catch {
                return { ok: false, status: 0, data: null };
            }
        }

        function init() {
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-display').innerText = currentUser.username || '…';
            updateBalanceUI(currentUser.balance || 0);

            // Restore lastClaimTime
            const storedTime = localStorage.getItem('lastClaimTime');
            if (storedTime) lastClaimTime = parseInt(storedTime);

            // Restore Stage Progress
            stageProgress = parseInt(sessionStorage.getItem('stage_progress_vignette') || '0');
            updateProgressUI();

            startHealthBar();
            loadCachedStory();
        }

        function updateBalanceUI(amount) {
            document.getElementById('balance-display-top').innerText = amount.toFixed(2);
        }

        function updateProgressUI() {
            document.getElementById('progress-display').innerText = stageProgress;
        }

        function loadCachedStory() {
            const cached = localStorage.getItem('cachedStory');
            if (cached) {
                const s = JSON.parse(cached);
                renderStory(s);
            } else {
                renderPlaceholder();
            }
        }

        function renderPlaceholder() {
            document.getElementById('story-title').innerText = 'No story cached';
            document.getElementById('story-body').textContent = 'Click "Fetch New Story" to download and cache a short story.';
        }

        function renderStory(s) {
            document.getElementById('story-title').innerText = s.title || 'Untitled';
            document.getElementById('story-body').textContent = (s.story || '') + (s.moral ? "\n\nMoral: " + s.moral : '');
        }

        async function fetchAndCacheStory() {
            showMessage('Fetching story...');
            try {
                const res = await fetch(STORY_API_ENDPOINT);
                if (!res.ok) throw new Error('fetch fail');
                const data = await res.json();
                const storyObj = { id: data._id, title: data.title + " — " + data.author, story: data.story, moral: data.moral };
                localStorage.setItem('cachedStory', JSON.stringify(storyObj));
                renderStory(storyObj);
                showMessage('Story cached');
            } catch {
                showMessage('Failed to fetch story');
            }
        }

        function startHealthBar() {
            const bar = document.getElementById('health-bar');
            setInterval(() => {
                const now = Date.now();
                const elapsed = (now - lastClaimTime) / 1000;
                let pct = 0;
                let color = '#ef4444';
                if (elapsed < 30) {
                    pct = (elapsed / 30) * 33;
                    color = '#ef4444';
                } else if (elapsed < 60) {
                    pct = 33 + ((elapsed - 30) / 30) * 33;
                    color = '#eab308';
                } else {
                    pct = 66 + ((elapsed - 60) / 30) * 34;
                    if (pct > 100) pct = 100;
                    color = '#22c55e';
                }
                bar.style.width = pct + '%';
                bar.style.background = color;
            }, 100);
        }

        async function attemptReward() {
            if (isProcessingReward) return;

            isProcessingReward = true;
            showMessage('Verifying engagement...');

            const res = await fetchJson('/add-points', {
                method: 'POST',
                body: JSON.stringify({
                    username: currentUser.username,
                    token: currentUser.token
                })
            });

            if (res.ok) {
                currentUser.balance = res.data.balance;
                sessionStorage.setItem('ad_user', JSON.stringify(currentUser));
                updateBalanceUI(currentUser.balance);

                lastClaimTime = Date.now();
                localStorage.setItem('lastClaimTime', lastClaimTime);

                const status = res.data.speed_status;
                if (status === 'red') {
                    showMessage(`Warning: Too Fast! +R ${res.data.earned} (Penalty)`);
                } else {
                     showMessage(`Reward Unlocked! +R ${res.data.earned}`);
                }

                // Increment Progress
                stageProgress++;
                sessionStorage.setItem('stage_progress_vignette', stageProgress.toString());
                updateProgressUI();

                if (stageProgress >= STAGE_TARGET) {
                    setTimeout(() => {
                        showMessage('Stage Complete! Rotating...');
                        // Reset progress
                        sessionStorage.removeItem('stage_progress_vignette');
                        // Advance Index
                        let idx = parseInt(sessionStorage.getItem('berserker_index') || '0');
                        sessionStorage.setItem('berserker_index', (idx + 1).toString());
                        // Go to Router
                        window.location.href = 'berserker.html';
                    }, 2000);
                }

            } else {
                showMessage(res.data?.error || 'Reward failed.');
            }
            isProcessingReward = false;
        }

        // Logic: Blur -> Timer. Focus -> Check.
        window.addEventListener('blur', () => {
            adStartTime = Date.now();
            showMessage('Ad Timer Started... Return in 10s', 5000);
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0) {
                const duration = Date.now() - adStartTime;
                adStartTime = 0; // Reset

                if (duration >= 10000) { // 10 seconds
                    // Auto-claim
                    attemptReward();
                } else {
                    showMessage(`Too Short! (${(duration/1000).toFixed(1)}s). Watch for 10s+.`, 4000);
                }
            }
        });

        document.getElementById('fetch-btn').addEventListener('click', fetchAndCacheStory);

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
