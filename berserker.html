<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berserker - Loading...</title>
    <style>
        body { background: #050617; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .loader { font-size: 1.2rem; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="loader">Initializing Berserker Mode...</div>

    <script>
        // Files for the 5 stages
        const STAGES = [
            'berserker_vignette.html',
            'berserker_popunder.html',
            'berserker_inpage.html',
            'berserker_direct.html'
        ];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            // While there remain elements to shuffle.
            while (currentIndex != 0) {
                // Pick a remaining element.
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                // And swap it with the current element.
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function init() {
            // 1. Auth Check
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }

            // 2. Playlist Logic
            let playlist = JSON.parse(sessionStorage.getItem('berserker_playlist') || '[]');
            let index = parseInt(sessionStorage.getItem('berserker_index') || '0');

            // If playlist is empty or index is out of bounds, generate new playlist
            if (playlist.length === 0 || index >= playlist.length) {
                playlist = shuffle([...STAGES]);
                index = 0;
                sessionStorage.setItem('berserker_playlist', JSON.stringify(playlist));
                sessionStorage.setItem('berserker_index', index.toString());
            }

            // 3. Redirect
            const target = playlist[index];
            console.log(`Redirecting to stage ${index + 1}/${playlist.length}: ${target}`);
            window.location.replace(target);
        }

        init();
    </script>
</body>
</html>
