<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berserker - Read Mode</title>

    <!-- Monetag Multitag (ALL-IN-ONE) -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="204316" async data-cfasync="false"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050617;
            --surface: #0f172a;
            --text: #e6eef8;
            --muted: #94a3b8;
            --accent: #d4af37;
            --radius: 10px;
        }
        html, body { height: 100% }
        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        header { width: 100%; padding: 14px 0; text-align: center; background: var(--surface); border-bottom: 2px solid rgba(255,255,255,0.03); }
        main { width: 100%; max-width: 720px; padding: 20px; box-sizing: border-box; flex: 1; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        #ads-container { width: 100%; max-width: 720px; margin-top: 12px; }
        .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1.15rem; margin-bottom: 12px; }
        .body { line-height: 1.6; color: var(--text); white-space: pre-wrap; }
        .controls { display: flex; gap: 8px; margin-top: 14px; }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        .btn.primary { background: var(--accent); color: #000; border-color: transparent; }
        #message {
            position: fixed; top: 72px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(0,0,0,0.6); display: none;
        }
        .loader { color: var(--muted); padding: 12px 0; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:700">BERSERKER — READ MODE</div>
    </header>

    <div id="ads-container" aria-hidden="true"></div>  
    <div id="message"></div>

    <main>
        <div class="card">
            <div class="meta">
                <div>User: <span id="user-display">...</span></div>
                <div>Balance: R <span id="balance-display">0.00</span></div>
            </div>

            <div id="story-area">
                <div class="title" id="story-title">Loading story...</div>
                <div class="body" id="story-body"><div class="loader">Please wait.</div></div>
            </div>

            <div class="controls">
                <button class="btn" id="fetch-btn">Fetch New Story</button>
                <button class="btn" id="clear-cache-btn">Clear Cache</button>
                <button class="btn primary" id="claim-btn">Claim Reward</button>
            </div>
        </div>
    </main>

    <script>
        // backend logic preserved
        const API_URL = "https://dark-mud-87fb.jonasmochebane.workers.dev";
        const STORY_API_ENDPOINT = "https://shortstories-api.onrender.com/"; // fetch random short story 2

        let currentUser = null;
        let isProcessingReward = false;

        function showMessage(txt, ms = 2500) {
            const el = document.getElementById('message');
            el.textContent = txt;
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(()=> el.style.display = 'none', ms);
        }

        function getBaseUrl() {
            return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:8000'
                : API_URL;
        }

        async function fetchJson(path, opts = {}) {
            const url = `${getBaseUrl()}${path}`;
            const defaultHeaders = { 'Content-Type': 'application/json' };
            const safeOpts = Object.assign({ headers: defaultHeaders }, opts);
            try {
                const res = await fetch(url, safeOpts);
                let data = null;
                try { data = await res.json(); } catch(e){}
                return { ok: res.ok, status: res.status, data };
            } catch {
                return { ok: false, status: 0, data: null };
            }
        }

        function init() {
            const saved = sessionStorage.getItem('ad_user');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-display').innerText = currentUser.username || '…';
            document.getElementById('balance-display').innerText = (currentUser.balance || 0).toFixed(2);
            loadCachedStory();
        }

        function loadCachedStory() {
            const cached = localStorage.getItem('cachedStory');
            if (cached) {
                const s = JSON.parse(cached);
                renderStory(s);
            } else {
                renderPlaceholder();
            }
        }

        function renderPlaceholder() {
            document.getElementById('story-title').innerText = 'No story cached';
            document.getElementById('story-body').textContent = 'Click "Fetch New Story" to download and cache a short story.';
        }

        function renderStory(s) {
            document.getElementById('story-title').innerText = s.title || 'Untitled';
            document.getElementById('story-body').textContent = (s.story || '') + (s.moral ? "\n\nMoral: " + s.moral : '');
        }

        async function fetchAndCacheStory() {
            showMessage('Fetching story...');
            try {
                const res = await fetch(STORY_API_ENDPOINT);
                if (!res.ok) throw new Error('fetch fail');
                const data = await res.json();
                const storyObj = { id: data._id, title: data.title + " — " + data.author, story: data.story, moral: data.moral };
                localStorage.setItem('cachedStory', JSON.stringify(storyObj));
                renderStory(storyObj);
                showMessage('Story cached');
            } catch {
                showMessage('Failed to fetch story');
            }
        }

        async function attemptReward() {
            if (isProcessingReward) return;
            isProcessingReward = true;
            showMessage('Verifying engagement...');
            const res = await fetchJson('/add-points', {
                method: 'POST',
                body: JSON.stringify({
                    username: currentUser.username,
                    token: currentUser.token
                })
            });
            if (res.ok) {
                currentUser.balance = res.data.balance;
                sessionStorage.setItem('ad_user', JSON.stringify(currentUser));
                document.getElementById('balance-display').innerText = currentUser.balance.toFixed(2);
                showMessage(`Reward Unlocked! +R ${res.data.earned}`);
            } else {
                showMessage(res.data?.error || 'Reward failed.');
            }
            isProcessingReward = false;
        }

        document.getElementById('fetch-btn').addEventListener('click', fetchAndCacheStory);
        document.getElementById('clear-cache-btn').addEventListener('click', () => {
            localStorage.removeItem('cachedStory');
            renderPlaceholder();
            showMessage('Cache cleared');
        });
        document.getElementById('claim-btn').addEventListener('click', attemptReward);

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
